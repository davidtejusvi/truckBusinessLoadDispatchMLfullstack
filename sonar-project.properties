sonar.projectKey=truckbiz
sonar.organization=YOUR_ORG
sonar.projectName=TruckBiz
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=frontend/src,backend/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/vite-env.d.ts

# Coverage reports (LCov)
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# SCM
sonar.scm.provider=git

# Pull request decoration (optional, requires SonarCloud PR integration)
sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=YOUR_ORG/truckBusinessTrac
