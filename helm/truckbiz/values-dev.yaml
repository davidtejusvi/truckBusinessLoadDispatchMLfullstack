# ── Dev environment overrides ────────────────────────────────────────────────

backend:
  image:
    tag: dev-latest
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  image:
    tag: dev-latest
  replicaCount: 1

ingress:
  host: truckbiz.dev.example.com
  tls:
    enabled: false

hpa:
  enabled: false
