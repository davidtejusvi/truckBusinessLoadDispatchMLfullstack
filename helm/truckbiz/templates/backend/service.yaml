apiVersion: v1
kind: Service
metadata:
  name: {{ include "truckbiz.backendFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truckbiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "truckbiz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
