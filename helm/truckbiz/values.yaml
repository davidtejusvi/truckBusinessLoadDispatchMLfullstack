# ── TruckBiz Helm Values ──────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

# ── Backend ───────────────────────────────────────────────────────────────────
backend:
  image:
    repository: YOUR_ECR_REPO.dkr.ecr.us-east-1.amazonaws.com/truckbiz-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    PORT: "3001"
    NODE_ENV: production

  # Secrets ref (DATABASE_URL, JWT_SECRET)
  existingSecret: truckbiz-secrets

  readinessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 5

  livenessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 30
    periodSeconds: 10

  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsUser: 1001
    runAsGroup: 1001

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: YOUR_ECR_REPO.dkr.ecr.us-east-1.amazonaws.com/truckbiz-frontend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: truckbiz.example.com
  tls:
    enabled: true
    secretName: truckbiz-tls

# ── Horizontal Pod Autoscaler ────────────────────────────────────────────────
hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: truckbiz-sa
  annotations: {}

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
