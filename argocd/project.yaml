apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: truckbiz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: TruckBiz load board platform — all environments
  sourceRepos:
    - "*"
  destinations:
    - namespace: truckbiz-dev
      server: https://kubernetes.default.svc
    - namespace: truckbiz-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: false
