apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truckbiz-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: truckbiz
    environment: dev
spec:
  project: truckbiz
  source:
    repoURL: https://github.com/YOUR_ORG/truckBusinessTrac
    targetRevision: HEAD
    path: helm/truckbiz
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: truckbiz-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
