version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: truckbiz
      POSTGRES_USER: truckbiz
      POSTGRES_PASSWORD: truckbiz123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file: ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      ML_SERVICE_PORT: "8000"
    depends_on:
      - backend

volumes:
  pgdata:
